<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<style>

body{

font-family:Arial;

background:#0f172a;

color:white;

padding:40px;

}

table{

width:100%;

border-collapse:collapse;

margin-top:30px;

}

th,td{

padding:15px;

border:1px solid #38bdf8;

text-align:left;

}

th{

background:#38bdf8;

color:black;

}

tr:nth-child(even){

background:#1e293b;

}

h1{

text-align:center;

}

</style>

</head>

<body>

<h1>Contact Messages</h1>

<table>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Message</th>

</tr>

{% for row in messages %}

<tr>

<td>{{ row.id }}</td>
<td>{{ row.name }}</td>
<td>{{ row.email }}</td>
<td>{{ row.message }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
